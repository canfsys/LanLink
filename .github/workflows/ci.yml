name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run self-tests
        shell: powershell
        env:
          LANLINK_TEST_DATA_DIR: ${{ runner.temp }}\LanLinkData
          LANLINK_TEST_STATE_DIR: ${{ runner.temp }}\LanLinkState
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/Test-LanLink.ps1
